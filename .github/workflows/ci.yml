name: CI

on:
  push:
    branches:
    - main
    - 'v*'
    tags:
    - '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1  # v3.2.1
    permissions:
      id-token: write
    with:
      envs: |
        - name: Security audit
          linux: bandit

        - name: Python 3.11 (Windows)
          windows: py311-test
          posargs: -v

        - name: Python 3.11 (Linux)
          linux: py311-test
          posargs: -v

        - name: Python 3.12 (OSX)
          macos: py312-test
          posargs: -v

        - name: Python 3.13 (OSX)
          macos: py313-test
          posargs: -v

        - name: Python 3.13 (Windows)
          windows: py313-test
          posargs: -v

        - name: Python 3.14 (Windows)
          windows: py314-test
          posargs: -v

        - name: Python 3.15 (Linux)
          linux: py315-test
          posargs: -v

        - name: Python 3.15 (OSX)
          macos: py315-test
          posargs: -v

        - name: Python 3.15 (Windows)
          windows: py315-test
          posargs: -v

        # `tox` does not currently respect `requires-python` versions when creating testing environments;
        # if this breaks, add an upper pin to `requires-python` and revert this py3 to the latest working version

        - name: Python 3.15 (Linux) with coverage
          linux: py315-test-cov
          posargs: -v
          coverage: codecov-oidc
          pytest-results-summary: true

        - name: Python 3 (Linux with dev dependencies)
          linux: py3-test-devdeps
          posargs: -v
