[tox]
envlist =
    py{311,312,313,314,315}-test{,-devdeps}{,-cov}
    bandit

[testenv]
description =
    run tests
    devdeps: with the latest developer version of key dependencies
    cov: with coverage

# Pass through the following environment variables which are needed for the CI
pass_env =
    HOME
    WINDIR
    LC_ALL
    LC_CTYPE
    CC
    CI
    DISPLAY

set_env =
    devdeps: PIP_EXTRA_INDEX_URL = https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
    cov: COVERAGE_FILE = {tox_root}/.coverage

# Run the tests in a temporary directory to make sure that we don't import
# stsci.imagestats from the source tree
changedir = .tmp/{env_name}

# The following indicates which [project.optional-dependencies] from pyproject.toml will be installed
extras =
    test

deps =
    cov: pytest-cov
    devdeps: numpy>=0.0.dev0

install_command =
    !devdeps: python -I -m pip install
    devdeps: python -I -m pip install -v --pre

commands =
    pip freeze
    pytest --pyargs stsci.imagestats \
    cov: --cov={env_site_packages_dir}/stsci/imagestats/ --cov-config={tox_root}/pyproject.toml --cov-report=term-missing \
    {posargs}

[testenv:bandit]
skip_install = true
changedir = {toxinidir}
description = Security audit with bandit
deps = bandit>=1.7
commands =
    pip freeze
    bandit stsci -r -x stsci/imagestats/tests
